name: Playwright In Docker

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  playwright-docker:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Playwright Docker image
        run: docker build -t aqa-playwright-tests .

      - name: Prepare artifact directories
        run: |
          mkdir -p playwright-report
          mkdir -p test-results

      - name: Run Playwright tests inside Docker
        env:
          QAUTO1_BASE_URL: ${{ secrets.QAUTO1_BASE_URL }}
          QAUTO2_BASE_URL: ${{ secrets.QAUTO2_BASE_URL }}
          HTTP_CREDENTIALS_USERNAME: ${{ secrets.HTTP_CREDENTIALS_USERNAME }}
          HTTP_CREDENTIALS_PASSWORD: ${{ secrets.HTTP_CREDENTIALS_PASSWORD }}
          QAUTO1_API_USER_EMAIL: ${{ secrets.QAUTO1_API_USER_EMAIL }}
          QAUTO1_API_USER_PASSWORD: ${{ secrets.QAUTO1_API_USER_PASSWORD }}
          QAUTO2_API_USER_EMAIL: ${{ secrets.QAUTO2_API_USER_EMAIL }}
          QAUTO2_API_USER_PASSWORD: ${{ secrets.QAUTO2_API_USER_PASSWORD }}
        run: |
          docker run --rm \
            --name playwright-tests \
            -e CI=true \
            -e QAUTO1_BASE_URL \
            -e QAUTO2_BASE_URL \
            -e HTTP_CREDENTIALS_USERNAME \
            -e HTTP_CREDENTIALS_PASSWORD \
            -e QAUTO1_API_USER_EMAIL \
            -e QAUTO1_API_USER_PASSWORD \
            -e QAUTO2_API_USER_EMAIL \
            -e QAUTO2_API_USER_PASSWORD \
            -v "${{ github.workspace }}/playwright-report:/app/playwright-report" \
            -v "${{ github.workspace }}/test-results:/app/test-results" \
            aqa-playwright-tests

      - name: Upload Playwright HTML report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Upload Playwright test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 30
